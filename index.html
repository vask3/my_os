<!DOCTYPE html>
<html>

  <body style="background: linear-gradient(135deg, #667eea, #764ba2); background-size: cover; height: 100vh; margin: 0; font-family: sans-serif; color: white; overflow: hidden;">

    <!-- Горна лента (Часовник) -->
    <div style="display: flex; justify-content: space-between; padding: 10px;">
      <p>VaskoOS</p>
      <p id="timeElement"></p>
    </div>

    <!-- Централен прозорец -->
    <div style="position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); padding: 20px; border: thick double orange; width: 200px; border-radius: 16px; background-color: rgba(255, 255, 255, 0.2); text-align: center;">
      <h1 style="margin: 4px;">vaskoOS</h1>  
      <h2>Introduction</h2>
      <p>Hello world!</p>
      
      <img style="width: 140px; height: auto; display: block; margin: 15px auto; border-radius: 4px;" 
           src="ikea.png" alt="IKEA Logo" />
      <br>
      
      <a href="https://instagram.com" style="color: yellow;">label</a>
    </div>

    <!-- ДОЛНА ЛЕНТА (TASKBAR) -->
    <div style="position: absolute; bottom: 0; left: 0; width: 100%; background-color: rgba(0, 0, 0, 0.5); padding: 10px; display: flex; align-items: center; box-sizing: border-box;">
      <!-- Бутонът СТАРТ -->
      <button onclick="toggleStartMenu()" style="background-color: orange; border: none; color: black; font-weight: bold; padding: 8px 16px; border-radius: 8px; cursor: pointer;">
        🚀 Старт
      </button>
    </div>

    <!-- ИЗСКАЧАЩО СТАРТ МЕНЮ (По подразбиране е скрито чрез display: none) -->
    <div id="startMenu" style="display: none; position: absolute; bottom: 55px; left: 10px; width: 180px; background-color: rgba(0, 0, 0, 0.8); border: 2px solid orange; border-radius: 8px; padding: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5);">
      <p style="margin: 0 0 10px 0; font-weight: bold; border-bottom: 1px solid orange; padding-bottom: 5px;">Приложения</p>
      <!-- Линкове в менюто -->
      <a href="https://instagram.com" target="_blank" style="display: block; color: white; text-decoration: none; margin: 5px 0; padding: 5px; border-radius: 4px; background-color: rgba(255,255,255,0.1);">🌐 Hack Club</a>
      <a href="https://ikea.bg" target="_blank" style="display: block; color: white; text-decoration: none; margin: 5px 0; padding: 5px; border-radius: 4px; background-color: rgba(255,255,255,0.1);">🛒 IKEA Магазин</a>
    </div>

    <script>
      // Скрипт за часовника
      setInterval(() => {
        document.querySelector("#timeElement").innerHTML = new Date().toLocaleString();
      }, 1000);

      // Скрипт за отваряне и затваряне на Старт менюто
      function toggleStartMenu() {
        var menu = document.getElementById("startMenu");
        if (menu.style.display === "none") {
          menu.style.display = "block"; // Показва менюто
        } else {
          menu.style.display = "none";  // Скрива менюто
        }
      }
    </script>

  </body>
</html>
