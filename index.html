<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaskoOS</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;color:white;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#312e81,#701a75)
}
header,footer{
  height:55px;padding:15px 20px;
  background:#0005;backdrop-filter:blur(15px);
  display:flex;align-items:center;justify-content:space-between
}
main{height:calc(100vh - 110px);position:relative}

.window{
  position:absolute;width:280px;
  background:#ffffff15;
  border:1px solid #ffffff30;
  border-radius:15px;
  backdrop-filter:blur(20px);
  box-shadow:0 15px 40px #0008;
  overflow:hidden;
  z-index:1
}

.title{
  padding:12px 15px;
  background:#0004;
  cursor:grab;
  font-weight:bold;
  user-select:none
}

.content{padding:18px;text-align:center}

button{
  border:0;border-radius:8px;
  padding:9px 13px;
  color:white;background:#ffffff25;
  cursor:pointer
}
button:hover{background:#ffffff40}

textarea,input{
  width:100%;padding:10px;
  border:0;border-radius:8px;
  margin-top:8px
}

#home{left:50%;top:35%;transform:translate(-50%,-50%)}
#note{left:30px;top:30px}
#calc{right:30px;bottom:30px}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;margin-top:8px
}

#menu{
  display:none;
  position:absolute;
  bottom:65px;left:15px;
  background:#111e;
  padding:15px;
  border-radius:12px;
  z-index:100
}

@media(max-width:700px){
  .window{width:240px}
  #home{left:50%;top:50%}
}
</style>
</head>

<body>

<header>
<b>🚀 VaskoOS</b>
<span id="clock"></span>
</header>

<main>

<!-- HOME -->
<div class="window" id="home">
  <div class="title">🖥️ VaskoOS</div>
  <div class="content">
    <h1>Welcome!</h1>
    <p>My very own WebOS</p>
    <p id="quote">Keep coding!</p>
    <button onclick="newQuote()">💬 New Quote</button>
  </div>
</div>

<!-- NOTEPAD -->
<div class="window" id="note">
  <div class="title">📝 Notepad</div>
  <div class="content">
    <textarea id="text" rows="7"
      placeholder="Write something..."></textarea>
  </div>
</div>

<!-- CALCULATOR -->
<div class="window" id="calc">
  <div class="title">🧮 Calculator</div>
  <div class="content">
    <input id="screen" readonly>

    <div class="grid">
      <button onclick="clearCalc()">C</button>
      <button onclick="add('/')">÷</button>
      <button onclick="add('*')">×</button>
      <button onclick="add('-')">−</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('+')">+</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="result()">=</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('0')">0</button>
    </div>
  </div>
</div>

</main>

<footer>
<button onclick="menu()">🚀 Start</button>
<button onclick="show('note')">📝 Notepad</button>
<button onclick="show('calc')">🧮 Calculator</button>
</footer>

<div id="menu">
<b>APPLICATIONS</b><br><br>
<button onclick="show('note');menu()">📝 Notepad</button>
<br><br>
<button onclick="show('calc');menu()">🧮 Calculator</button>
</div>

<script>

/* CLOCK */
function clock(){
  clockElement.textContent=new Date().toLocaleTimeString();
}
let clockElement=document.getElementById("clock");
setInterval(clock,1000);
clock();


/* WINDOWS */

let z=1;

document.querySelectorAll(".window").forEach(win=>{
  let title=win.querySelector(".title");
  let dragging=false,x=0,y=0;

  title.addEventListener("pointerdown",e=>{
    dragging=true;
    z++;
    win.style.zIndex=z;

    let r=win.getBoundingClientRect();
    x=e.clientX-r.left;
    y=e.clientY-r.top;

    title.setPointerCapture(e.pointerId);
  });

  title.addEventListener("pointermove",e=>{
    if(!dragging)return;

    win.style.left=(e.clientX-x)+"px";
    win.style.top=(e.clientY-y)+"px";
    win.style.transform="none";
  });

  title.addEventListener("pointerup",()=>{
    dragging=false;
  });
});


/* START MENU */

function menu(){
  let m=document.getElementById("menu");
  m.style.display=m.style.display=="block"?"none":"block";
}

function show(id){
  document.getElementById(id).style.display="block";
}


/* QUOTES */

let quotes=[
  "Keep calm and code.",
  "Build something awesome.",
  "Every expert was once a beginner.",
  "Code. Create. Repeat.",
  "Never stop learning!"
];

function newQuote(){
  quote.textContent=
    quotes[Math.floor(Math.random()*quotes.length)];
}


/* CALCULATOR */

let screen=document.getElementById("screen");

function add(x){
  screen.value+=x;
}

function clearCalc(){
  screen.value="";
}

function result(){
  try{
    screen.value=eval(screen.value);
  }catch{
    screen.value="Error";
  }
}


/* NOTEPAD SAVE */

let text=document.getElementById("text");

text.value=localStorage.note||"";

text.oninput=()=>{
  localStorage.note=text.value;
};

</script>

</body>
</html>
