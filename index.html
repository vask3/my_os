<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaskoOS</title>
    <!-- Истински работещ линк за иконите от FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* // общ дизайн и десктоп фон */
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
          height: 100vh;
          overflow: hidden;
          user-select: none;
          background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #020617 100%);
          color: #f8fafc;
        }

        /* // горната лента на операционната система */
        .top-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 48px;
          background: rgba(15, 23, 42, 0.75);
          backdrop-filter: blur(20px);
          padding: 0 19px;
          z-index: 1000;
          position: relative;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand { 
          font-size: 16px; 
          font-weight: 700; 
          color: #818cf8;
        }

        #clock {
          font-weight: 600;
          color: #94a3b8;
        }

        /* // работния плот с иконите */
        #desktop {
          position: relative;
          height: calc(100vh - 96px);
          padding: 23px;
        }

        .icon-grid {
          display: grid;
          width: 240px;
          grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
          gap: 23px;
        }

        .desk-icon {
          display: flex;
          cursor: pointer;
          flex-direction: column;
          align-items: center;
          border-radius: 17px;
          padding: 9px;
          transition: all 0.2s ease-in-out;
        }

        .desk-icon:hover {
          background: rgba(255, 255, 255, 0.06);
          transform: translateY(-2px);
        }

        .icon-box {
          width: 56px;
          height: 56px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(30, 41, 59, 0.7);
          font-size: 20px;
          border-radius: 17px;
          color: #818cf8;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .desk-icon span {
          font-size: 12px;
          margin-top: 8px;
          color: #cbd5e1;
        }

        /* // стъклените прозорци за приложенията */
        .window {
          position: absolute;
          width: 350px;
          backdrop-filter: blur(25px);
          background: rgba(15, 23, 42, 0.85);
          border-radius: 21px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
          overflow: hidden;
          display: none; /* първоначално са скрити */
          top: 120px;
          left: 120px;
        }

        .win-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: rgba(255, 255, 255, 0.03);
          padding: 11px 17px;
          font-size: 14px;
          font-weight: 600;
          cursor: move;
          border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .win-header i {
          color: #818cf8;
          margin-right: 6px;
        }

        .win-close {
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(239, 68, 68, 0.15);
          color: #f87171;
          border: none;
          width: 26px;
          height: 26px;
          border-radius: 50%;
          cursor: pointer;
        }

        .win-body {
          padding: 17px;
          font-size: 14px;
          color: #94a3b8;
        }

        /* // бутони и кутии за писане */
        .btn-primary, .btn-start {
          background: #6366f1;
          border: none;
          color: #fff;
          padding: 9px 16px;
          border-radius: 10px;
          cursor: pointer;
        }

        .btn-secondary {
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.05);
          color: #cbd5e1;
          padding: 9px 16px;
          border-radius: 10px;
          cursor: pointer;
        }

        textarea, input[type="text"] {
          width: 100%;
          background: rgba(30, 41, 59, 0.6);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 10px;
          color: #f8fafc;
          padding: 10px;
          outline: none;
        }

        textarea { 
          height: 110px; 
          resize: none; 
        }

        #canvas {
          background: #020617;
          border-radius: 10px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          cursor: crosshair;
        }

        /* // калкулатор решетка */
        .calc-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
          margin-top: 8px;
        }

        /* // задачи лист */
        #task-list {
          list-style: none;
          max-height: 120px;
          overflow-y: auto;
          margin-top: 8px;
        }

        #task-list li {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 8px 12px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.05);
          border-radius: 8px;
          margin-bottom: 6px;
        }

        .task-del {
          color: #f87171;
          cursor: pointer;
          font-weight: bold;
        }

        /* // черния екран на терминала */
        #term-out {
          height: 130px;
          background: #020617;
          border-radius: 10px;
          padding: 11px;
          font-family: monospace;
          font-size: 12px;
          overflow-y: auto;
          color: #38bdf8;
          margin-bottom: 10px;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* // долната лента */
        .taskbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 48px;
          background: rgba(15, 23, 42, 0.75);
          backdrop-filter: blur(20px);
          padding: 0 19px;
          z-index: 1000;
          position: fixed;
          width: 100%;
          bottom: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* // менюто от бутона старт */
        #start-menu {
          position: absolute;
          bottom: 56px;
          left: 16px;
          background: rgba(15, 23, 42, 0.95);
          backdrop-filter: blur(25px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 15px;
          box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
          width: 200px;
          padding: 8px;
          z-index: 2000;
        }

        .hidden { 
          display: none; 
        }

        .menu-item {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 14px;
          color: #cbd5e1;
          cursor: pointer;
          border-radius: 9px;
          font-size: 13px;
        }

        .menu-item:hover {
          background: rgba(129, 140, 248, 0.15);
          color: #fff;
        }

        /* // форсиране на шрифта за иконите */
        .icon-box i, .win-header i, .menu-item i {
          font-family: "Font Awesome 6 Free", "Font Awesome 5 Free", sans-serif !important;
          font-style: normal;
          font-weight: 900;
        }
    </style>
</head>
<body>

    <!-- горна лента -->
    <header class="top-bar">
        <div class="brand">VaskoOS</div>
        <div id="clock">00:00:00</div>
    </header>

    <!-- работен плот -->
    <main id="desktop">
        
        <div class="icon-grid">
            <div class="desk-icon" onclick="openWin('win-about')">
                <div class="icon-box"><i class="fa-solid fa-info"></i></div>
                <span>About</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-notes')">
                <div class="icon-box"><i class="fa-solid fa-file-lines"></i></div>
                <span>Notepad</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-paint')">
                <div class="icon-box"><i class="fa-solid fa-paint-brush"></i></div>
                <span>Paint</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-calc')">
                <div class="icon-box"><i class="fa-solid fa-calculator"></i></div>
                <span>Calculator</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-tasks')">
                <div class="icon-box"><i class="fa-solid fa-list-check"></i></div>
                <span>Tasks</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-pomo')">
                <div class="icon-box"><i class="fa-solid fa-clock"></i></div>
                <span>Pomodoro</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-weather')">
                <div class="icon-box"><i class="fa-solid fa-cloud-sun"></i></div>
                <span>Weather</span>
            </div>
            <div class="desk-icon" onclick="openWin('win-terminal')">
                <div class="icon-box"><i class="fa-solid fa-terminal"></i></div>
                <span>Terminal</span>
            </div>
        </div>

        <!-- 1. за системата -->
        <div class="window" id="win-about">
            <div class="win-header">
