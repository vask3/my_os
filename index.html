<!DOCTYPE html>
<html lang="bg">
<head>
  <title>Vasko OS</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: sans-serif;
    }

    .topbar {
      height: 30px;
      background: #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    #desktop {
      padding: 20px;
      display: flex;
      gap: 15px;
    }

    .icon {
      width: 60px;
      text-align: center;
      cursor: pointer;
    }

    .icon-box {
      display: block;
      width: 40px;
      height: 40px;
      background: #222;
      border: 1px solid #444;
      line-height: 40px;
      margin: 0 auto 5px;
      border-radius: 6px;
    }

    .window {
      display: none;
      position: absolute;
      top: 80px;
      left: 80px;
      width: 250px;
      background: #1c1c1c;
      border: 1px solid #444;
    }

    .window-header {
      background: #2a2a2a;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
    }

    .window-body {
      padding: 10px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: #000;
      color: #fff;
      border: 1px solid #444;
    }

    .calc-pad button {
      width: 45px;
      height: 30px;
      margin: 2px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>Vasko OS</span>
    <span id="clock">00:00:00</span>
  </div>

  <div id="desktop">
    <div class="icon" onclick="openWindow()">
      <span class="icon-box">📝</span>
      <span>Notes</span>
    </div>

    <div class="icon" onclick="openCalc()">
      <span class="icon-box">🧮</span>
      <span>Calc</span>
    </div>
  </div>

  <div class="window" id="myWindow">
    <div class="window-header">
      <span>Notepad</span>
      <button onclick="closeWindow()">X</button>
    </div>
    <div class="window-body">
      <textarea id="noteText" placeholder="Пиши тук..."></textarea>
    </div>
  </div>

  <div class="window" id="calcWindow">
    <div class="window-header">
      <span>Calculator</span>
      <button onclick="closeCalc()">X</button>
    </div>
    <div class="window-body">
      <div id="calcScreen" style="background:#000; padding:5px; text-align:right; margin-bottom:5px;">0</div>
      <div class="calc-pad">
        <button onclick="press('7')">7</button>
        <button onclick="press('8')">8</button>
        <button onclick="press('9')">9</button>
        <button onclick="press('+')">+</button><br>
        <button onclick="press('4')">4</button>
        <button onclick="press('5')">5</button>
        <button onclick="press('6')">6</button>
        <button onclick="press('-')">-</button><br>
        <button onclick="press('1')">1</button>
        <button onclick="press('2')">2</button>
        <button onclick="press('3')">3</button>
        <button onclick="calculate()">=</button>
      </div>
    </div>
  </div>

  <script>
    // Часовник - обновява се всяка секунда
    setInterval(function() {
      let now = new Date();
      document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
    }, 1000);

    // Notepad
    function openWindow() {
      document.getElementById('myWindow').style.display = 'block';
    }
    function closeWindow() {
      document.getElementById('myWindow').style.display = 'none';
    }

    // Calculator
    function openCalc() {
      document.getElementById('calcWindow').style.display = 'block';
    }
    function closeCalc() {
      document.getElementById('calcWindow').style.display = 'none';
    }

    let calcValue = "";
    function press(num) {
      calcValue += num;
      document.getElementById('calcScreen').textContent = calcValue;
    }
    function calculate() {
      calcValue = eval(calcValue).toString();
      document.getElementById('calcScreen').textContent = calcValue;
    }
  </script>
</body>
</html>
