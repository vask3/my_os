<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>vaskoOS</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:Arial;color:white;background:linear-gradient(135deg,#0f172a,#1e1b4b,#311042)}
header,footer{padding:12px 24px;background:#0004;backdrop-filter:blur(15px);display:flex;justify-content:space-between}
main{height:calc(100vh - 100px);position:relative}
.win{position:absolute;padding:20px;border:1px solid #fff2;border-radius:18px;background:#fff1;backdrop-filter:blur(20px);box-shadow:0 15px 40px #0006}
button{cursor:pointer;border:0;border-radius:8px;padding:9px;color:white;background:#ffffff20}
button:hover{filter:brightness(1.3)}
#home{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:280px}
#note{top:30px;left:30px;width:250px}
#calc{right:30px;bottom:30px;width:250px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:0}
textarea{height:120px;resize:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.grid button{font-size:16px}
#menu{display:none;position:absolute;bottom:65px;left:20px;padding:15px;width:200px;background:#111e;border:1px solid #fff2;border-radius:12px}
#menu button{display:block;width:100%;margin:5px 0;text-align:left}
</style>
</head>

<body>

<header>
<b>VaskoOS</b><span id="clock"></span>
</header>

<main>

<div class="win" id="home">
<button onclick="theme()">🌓</button>
<h1>vaskoOS</h1>
<h3>Introduction</h3>
<p>Hello world!</p>

<div style="background:#0051ba;padding:25px">
<div style="background:#fc0;color:#051b8a;padding:20px;border-radius:50%;font-size:25px;font-weight:bold">
IKEA
</div>
</div>

<p id="quote">Loading...</p>
<a href="https://instagram.com" target="_blank" style="color:#fcd34d">
Instagram →
</a>
</div>

<div class="win" id="note">
<h2>📝 Notepad</h2>
<textarea id="text" placeholder="Write something..."></textarea>
</div>

<div class="win" id="calc">
<h2>🧮 Calculator</h2>
<input id="screen" readonly>

<div class="grid">
<button onclick="clr()">C</button>
<button onclick="add('/')">/</button>
<button onclick="add('*')">*</button>
<button onclick="add('-')">-</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('+')">+</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="result()">=</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('0')">0</button>
</div>
</div>

</main>

<footer>
<button onclick="menu()">🚀 Start</button>
<button onclick="newQuote()">💬 Quote</button>
<button onclick="show('note')">📝 Notepad</button>
<button onclick="show('calc')">🧮 Calculator</button>
</footer>

<div id="menu">
<b>APPLICATIONS</b>
<button onclick="show('note');menu()">📝 Notepad</button>
<button onclick="show('calc');menu()">🧮 Calculator</button>
<a href="https://ikea.bg" target="_blank">
<button>🛒 IKEA</button>
</a>
</div>

<script>
const $=id=>document.getElementById(id);

function clock(){
let d=new Date();
$("clock").textContent=d.toLocaleTimeString();
}
setInterval(clock,1000);clock();

function menu(){
$("menu").style.display=$("menu").style.display=="block"?"none":"block";
}

function show(id){
$(""+id).style.display="block";
}

function theme(){
document.body.style.background=
document.body.style.background.includes("fff")
?"linear-gradient(135deg,#0f172a,#1e1b4b,#311042)"
:"linear-gradient(135deg,#60a5fa,#c4b5fd,#f9a8d4)";
}

let quotes=[
"Keep calm and code.",
"Every expert was once a beginner.",
"Build something awesome.",
"Code. Create. Repeat.",
"Never stop learning."
];

function newQuote(){
$("quote").textContent=
quotes[Math.floor(Math.random()*quotes.length)];
}
newQuote();

function add(x){
$("screen").value+=x;
}

function clr(){
$("screen").value="";
}

function result(){
try{
$("screen").value=eval($("screen").value);
}catch{
$("screen").value="Error";
}
}

$("text").value=localStorage.note||"";
$("text").oninput=()=>localStorage.note=$("text").value;
</script>

</body>
</html>
