<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>VaskoOS - alpha</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; margin: 0; }
        .desktop { padding: 20px; display: flex; gap: 10px; }
        .icon { background: #222; border: 1px solid #444; padding: 10px; cursor: pointer; }
        
        .window {
            position: absolute; top: 100px; left: 100px;
            width: 250px; background: #18181b; border: 1px solid #444;
            display: none; padding: 10px;
        }
        .win-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 8px; }
        button { background: #333; color: white; border: none; padding: 3px 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="icon" onclick="openWin('about')">ℹ️ About</div>
        <div class="icon" onclick="openWin('notes')">📝 Notes</div>
    </div>

    <!-- Прозорци -->
    <div class="window" id="win-about">
        <div class="win-header">
            <span>About</span>
            <button onclick="closeWin('about')">X</button>
        </div>
        <p>VaskoOS prototype v0.1</p>
    </div>

    <div class="window" id="win-notes">
        <div class="win-header">
            <span>Notes</span>
            <button onclick="closeWin('notes')">X</button>
        </div>
        <textarea id="my-note" style="width:100%; background:#000; color:#fff; height:60px;"></textarea>
        <button onclick="saveNote()" style="margin-top:5px;">Save</button>
    </div>

    <script>
        function openWin(id) {
            document.getElementById('win-' + id).style.display = 'block';
        }
        function closeWin(id) {
            document.getElementById('win-' + id).style.display = 'none';
        }
        function saveNote() {
            localStorage.setItem('note', document.getElementById('my-note').value);
            alert('Saved to localstorage');
        }
        // Зареждане на бележката, ако я има
        if(localStorage.getItem('note')) {
            document.getElementById('my-note').value = localStorage.getItem('note');
        }
    </script>
</body>
</html>
